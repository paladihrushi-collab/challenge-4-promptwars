databases:
  - name: stadiummind-db
    plan: free
    region: oregon

services:
  - type: web
    name: stadiummind-ai-engine
    env: python
    buildCommand: cd ai-engine && pip install -r requirements.txt
    startCommand: cd ai-engine && uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: stadiummind-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stadiummind-db
          property: connectionString

  - type: web
    name: stadiummind-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_AI_ENGINE_URL
        fromService:
          name: stadiummind-ai-engine
          type: web
          property: host
      - key: NEXT_PUBLIC_WS_URL
        fromService:
          name: stadiummind-backend
          type: web
          property: host
